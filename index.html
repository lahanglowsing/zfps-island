<!doctype html><html lang="zh-Hant"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>卓楓學區探索地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<template id="zf-shell"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：全螢幕 3D 模型，介面像貼在立體地圖邊緣的野外調查標籤 */
:root {
  --ink: #14281d;          /* 山林墨綠：文字 */
  --ink-soft: #4d5f53;
  --panel: rgba(249, 251, 245, 0.94);
  --panel-solid: #f9fbf5;
  --line: #d3dccb;
  --river: #1f6fb2;        /* 秀姑巒溪藍：可操作元素 */
  --river-deep: #164f80;
  --sun: #f2c230;          /* 布農織紋黃：探索成就 */
  --bunun: #b8322a;        /* 布農織紋紅：玩家位置 */
  --veil: rgba(16, 36, 26, 0.62);
  --f-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --r: 14px;
  --gap: 10px;
  --inset-t: max(12px, env(safe-area-inset-top, 0px));
  --inset-b: max(12px, env(safe-area-inset-bottom, 0px));
  --inset-l: max(16px, env(safe-area-inset-left, 0px));
  --inset-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #bfe3f2; color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-font-smoothing: antialiased; touch-action: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; }
button:focus-visible, .lbl:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- 地標名稱 ---------- */
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; border: 0; padding: 3px 9px 4px; border-radius: 999px; background: var(--panel-solid); color: var(--ink); font-size: 13px; font-weight: 500; line-height: 1.3; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 3px 10px rgba(20,40,29,.18); }
.lbl::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 1px; }
.lbl.found { background: var(--sun); }
.lbl-campus { font-size: 12px; padding: 2px 7px 3px; }
.lbl-natural { background: var(--river); color: #fff; }
.lbl-natural.found { background: var(--river-deep); color: var(--sun); }
.lbl-area { font-family: var(--f-display); font-weight: 700; font-size: 20px; padding: 4px 14px 6px; background: var(--ink); color: #fff8dd; letter-spacing: .06em; cursor: default; }
.lbl-area.found { background: var(--ink); }
.lbl[hidden] { display: none !important; }

/* ---------- 抬頭介面 ---------- */
.hud { position: fixed; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
body.is-playing .hud { opacity: 1; pointer-events: auto; }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: 0 6px 24px rgba(20, 40, 29, .18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

#brand { top: var(--inset-t); left: var(--inset-l); display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; max-width: calc(100vw - 210px - var(--inset-l) - var(--inset-r)); flex-wrap: wrap; }
#brand h1 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: .04em; text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: #e3ecdd; color: var(--ink); white-space: nowrap; }
.chip b { font-variant-numeric: tabular-nums; }
.chip.sun { background: var(--sun); }

#mapbox { top: var(--inset-t); right: var(--inset-r); width: 196px; padding: 8px; }
#minimap { display: block; width: 100%; border-radius: 9px; cursor: crosshair; image-rendering: auto; }
.map-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--ink-soft); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 3px; }
#compass { position: absolute; top: 14px; left: 14px; width: 34px; height: 34px; border-radius: 50%; background: var(--panel-solid); box-shadow: 0 2px 6px rgba(0,0,0,.2); display: grid; place-items: center; pointer-events: none; }
#compass-needle { width: 34px; height: 34px; display: grid; place-items: center; }
#compass-needle span { font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--bunun); transform: translateY(-8px); }
#compass-needle::before { content: ""; position: absolute; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 9px solid var(--bunun); transform: translateY(1px); }

#readout { left: var(--inset-l); bottom: var(--inset-b); padding: 10px 14px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; align-items: baseline; }
#readout .k { font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; }
#readout .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
#readout .big { font-family: var(--f-display); font-size: 30px; line-height: 1; }
#readout .unit { font-size: 13px; font-weight: 500; margin-left: 2px; }

#tools { right: var(--inset-r); bottom: var(--inset-b); display: flex; flex-direction: column; gap: 8px; }
.tool { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 76px; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--panel-solid); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(20, 40, 29, .18); }
.tool[aria-pressed="true"], .tool[aria-expanded="true"] { background: var(--river); color: #fff; }
.tool svg { width: 18px; height: 18px; flex: none; }

#hint { left: 50%; bottom: var(--inset-b); transform: translateX(-50%); font-size: 12px; padding: 6px 12px; color: var(--ink-soft); white-space: nowrap; }
body.has-card #hint { opacity: 0; }

#card { left: 50%; bottom: calc(var(--inset-b) + 44px); transform: translateX(-50%); width: min(440px, calc(100vw - 2 * var(--inset-l) - 200px)); padding: 14px 16px 14px; z-index: 25; }
#card[hidden] { display: none; }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
#card-name { margin: 6px 0 4px; font-family: var(--f-display); font-size: 24px; line-height: 1.2; text-wrap: balance; }
#card-desc { margin: 0 0 10px; line-height: 1.65; font-size: 14px; max-width: 60ch; }
.task { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #eef3e8; font-size: 13px; color: var(--ink-soft); }
.task b { color: var(--ink); }
.card-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; background: #e3ecdd; }
.btn.primary { background: var(--river); color: #fff; }
#card-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-soft); }

#places { top: var(--inset-t); right: var(--inset-r); bottom: var(--inset-b); width: min(340px, calc(100vw - var(--inset-l) - var(--inset-r))); padding: 16px; z-index: 30; overflow-y: auto; }
#places[hidden] { display: none; }
#places h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; }
#places .sub { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
#places h3 { margin: 14px 0 6px; font-size: 13px; letter-spacing: .08em; color: var(--ink-soft); }
.place-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.place { display: flex; align-items: center; gap: 7px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 9px; font-size: 13px; cursor: pointer; min-width: 0; }
.place span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-soft); flex: none; }
.place.found .dot { background: var(--sun); border-color: #b38a12; }
#places-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #e3ecdd; cursor: pointer; font-size: 18px; }

#toast { top: calc(var(--inset-t) + 4px); left: 50%; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: var(--sun); color: var(--ink); font-weight: 700; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; }
#toast[hidden] { display: none; }

#joystick { left: calc(var(--inset-l) + 6px); bottom: calc(var(--inset-b) + 96px); width: 120px; height: 120px; border-radius: 50%; background: rgba(249, 251, 245, .55); border: 2px solid rgba(255,255,255,.8); display: none; place-items: center; touch-action: none; }
#joystick-knob { width: 52px; height: 52px; border-radius: 50%; background: var(--panel-solid); box-shadow: 0 3px 10px rgba(0,0,0,.25); pointer-events: none; }
@media (pointer: coarse) { #joystick { display: grid; } #hint { display: none; } }
body.is-bird #joystick { visibility: hidden; }

/* ---------- 開場 ---------- */
#boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: var(--inset-t) var(--inset-r) var(--inset-b) var(--inset-l); background: linear-gradient(180deg, rgba(16,36,26,.25), var(--veil) 55%); overflow-y: auto; }
#boot[hidden] { display: none; }
.boot-card { width: min(560px, 100%); padding: 26px 26px 22px; border-radius: 20px; background: var(--panel); box-shadow: 0 18px 50px rgba(10, 25, 18, .35); }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); }
.boot-card h1 { margin: 6px 0 8px; font-family: var(--f-display); font-size: clamp(32px, 7vw, 46px); line-height: 1.1; letter-spacing: .03em; text-wrap: balance; }
.lede { margin: 0 0 16px; font-size: 15px; line-height: 1.7; max-width: 46ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.fact { padding: 10px 12px; border-radius: 12px; background: #eef3e8; }
.fact .n { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.fact .t { font-size: 12px; color: var(--ink-soft); }
.boot-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.boot-actions .btn { padding: 13px 18px; font-size: 16px; }
.boot-actions .btn.primary:disabled { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--sun); font-size: 11px; vertical-align: 2px; }
#login-note { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--sun); background: #fbf6df; font-size: 13px; line-height: 1.65; border-radius: 0; }
#login-note[hidden] { display: none; }
#boot-status { margin: 12px 0 0; min-height: 1.2em; font-size: 13px; color: var(--ink-soft); }
.credit { margin: 14px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-soft); }

@media (max-width: 640px) {
  #brand h1 { font-size: 16px; }
  #brand { padding: 6px 10px; max-width: calc(100vw - 150px - var(--inset-l) - var(--inset-r)); }
  #mapbox { width: 136px; padding: 6px; }
  .map-foot .legend { display: none; }
  #compass { top: 10px; left: 10px; width: 28px; height: 28px; }
  #card { left: var(--inset-l); right: var(--inset-r); transform: none; width: auto; bottom: calc(var(--inset-b) + 230px); }
  #readout { bottom: calc(var(--inset-b) + 0px); left: calc(var(--inset-l) + 140px); padding: 8px 10px; gap: 0 8px; }
  #readout .big { font-size: 22px; }
  #joystick { bottom: var(--inset-b); }
  .tool { min-width: 0; height: 40px; padding: 0 11px; font-size: 13px; }
  .tool .t { display: none; }
  .facts .fact .n { font-size: 16px; white-space: nowrap; }
}
@media (max-width: 640px) and (pointer: fine) { #readout { left: var(--inset-l); } }
@media (prefers-reduced-motion: reduce) { .hud { transition: none; } }

/* ---------- 交通：ubike 與愛心專車 ---------- */
:root { --bike: #f0a020; --bike-ink: #5a3a00; --bubu: #2e8b57; --bubu-soft: #e2f2e8; }
.lbl-transport { font-size: 12px; padding: 2px 8px 3px; }
.lbl-ubike { background: var(--bike); color: var(--bike-ink); }
.lbl-bubu { background: var(--bubu); color: #fff; }
#action { right: var(--inset-r); bottom: calc(var(--inset-b) + 300px); border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 6px 18px rgba(20,40,29,.25); background: var(--bike); color: var(--bike-ink); display: flex; gap: 8px; align-items: center; max-width: min(320px, 70vw); text-align: left; line-height: 1.35; }
#action.bubu { background: var(--bubu); color: #fff; }
#action[hidden] { display: none; }
#action kbd { font: 700 11px var(--f-body); padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.55); color: inherit; }
#status-pill { top: calc(var(--inset-t) + 52px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 999px; background: var(--panel-solid); box-shadow: 0 6px 18px rgba(20,40,29,.2); font-size: 13px; white-space: nowrap; z-index: 35; }
#status-pill[hidden] { display: none; }
#status-pill b { font-variant-numeric: tabular-nums; }
#status-pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bike); }
#status-pill.bubu .dot { background: var(--bubu); }
#status-pill button { border: 0; border-radius: 999px; padding: 5px 10px; background: #e3ecdd; font-weight: 700; font-size: 12px; cursor: pointer; }
#transit { top: var(--inset-t); right: var(--inset-r); bottom: var(--inset-b); width: min(380px, calc(100vw - var(--inset-l) - var(--inset-r))); padding: 16px; z-index: 30; overflow-y: auto; }
#transit[hidden] { display: none; }
#transit h2 { margin: 0 0 10px; font-family: var(--f-display); font-size: 22px; }
#transit-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #e3ecdd; cursor: pointer; font-size: 18px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: #e9efe3; margin-bottom: 12px; }
.tabs button { border: 0; border-radius: 9px; padding: 8px 6px; font-weight: 700; background: transparent; cursor: pointer; }
.tabs button[aria-selected="true"] { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.fare { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
.fare.ubike { background: #fdf0d5; color: var(--bike-ink); }
.fare.bubu { background: var(--bubu-soft); color: #18472c; }
.fare b { font-size: 15px; }
.t-sec h3 { margin: 14px 0 6px; font-size: 13px; letter-spacing: .06em; color: var(--ink-soft); }
.row-list { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; }
.row .grow { flex: 1; min-width: 0; }
.row .sub { color: var(--ink-soft); font-size: 12px; }
.row button { border: 0; border-radius: 8px; padding: 6px 9px; background: #e3ecdd; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e3ecdd; }
.badge.ok { background: var(--bubu-soft); color: #18472c; } .badge.wait { background: #fdf0d5; color: var(--bike-ink); } .badge.off { background: #eee; color: #777; }
.form { display: grid; gap: 9px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
.form input, .form select { font: inherit; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); min-width: 0; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form .err { color: #b8322a; font-size: 12px; min-height: 1em; }
.empty { font-size: 13px; color: var(--ink-soft); padding: 6px 2px; }
@media (max-width: 640px) { #action { bottom: calc(var(--inset-b) + 250px); } #status-pill { top: calc(var(--inset-t) + 44px); } }

/* ---------- 平面配置編輯器 ---------- */
:root { --ed-bg: #f3f5ef; --ed-line: #cfd8c8; --ed-sel: #1f6fb2; --ed-warn: #c0392b; }
#btn-edit[hidden] { display: none; }
#editor { position: fixed; inset: 0; z-index: 70; display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr); background: var(--ed-bg); color: var(--ink); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#editor[hidden] { display: none; }
.ed-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel-solid); border-bottom: 1px solid var(--ed-line); }
.ed-bar h2 { margin: 0 auto 0 0; font-family: var(--f-display); font-size: 20px; }
.ed-bar .sub { font-size: 12px; color: var(--ink-soft); font-family: var(--f-body); font-weight: 400; margin-left: 6px; }
.ed-btn { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; background: #e3ecdd; color: var(--ink); white-space: nowrap; }
.ed-btn:disabled { opacity: .45; cursor: default; }
.ed-btn.primary { background: var(--river); color: #fff; }
.ed-btn.ubike { background: var(--bike); color: var(--bike-ink); }
.ed-btn.bubu { background: var(--bubu); color: #fff; }
.ed-btn.danger { background: #f6dcd8; color: #8e2a1f; }
.ed-btn[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.ed-map { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#ed-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; background: #dfe7d6; }
#ed-canvas.placing { cursor: crosshair; }
.ed-zoom { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 6px; }
.ed-zoom button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel-solid); box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 20px; font-weight: 700; cursor: pointer; }
.ed-hint { position: absolute; left: 12px; top: 12px; max-width: min(520px, calc(100% - 24px)); padding: 7px 11px; border-radius: 10px; background: rgba(255,255,255,.92); font-size: 12.5px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.ed-scale { position: absolute; left: 12px; bottom: 12px; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.9); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ed-side { overflow-y: auto; padding: 14px 16px 20px; border-left: 1px solid var(--ed-line); background: var(--panel-solid); display: grid; gap: 14px; align-content: start; }
.ed-side h3 { margin: 0 0 6px; font-size: 12.5px; letter-spacing: .08em; color: var(--ink-soft); }
.ed-layers { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-layers label { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--ed-line); border-radius: 999px; font-size: 12.5px; cursor: pointer; background: #fff; }
.ed-layers i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ed-add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ed-sel { padding: 12px; border-radius: 12px; background: #f1f5ec; display: grid; gap: 9px; }
.ed-sel .k { font-size: 12px; color: var(--ink-soft); }
.ed-sel .nm { font-family: var(--f-display); font-size: 20px; line-height: 1.2; }
.ed-sel input[type=text] { font: inherit; padding: 7px 9px; border: 1.5px solid var(--ed-line); border-radius: 8px; min-width: 0; }
.ed-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ed-row .ed-btn { padding: 7px 10px; }
.ed-row input[type=range] { flex: 1; min-width: 120px; }
.ed-num { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-soft); }
.ed-warn { color: var(--ed-warn); font-size: 12.5px; line-height: 1.5; }

function schoolWing({ along, x0, x1, ext, wallLine, corOut, rooms, stairs, chuan = null, arrays }) {
  // along='x'：北棟（沿圖面東西）；along='z'：西棟（沿圖面南北）

  const R = (a0, a1, b0, b1) => along === 'x' ? [a0, a1, b0, b1] : [b0, b1, a0, a1];
  const S = (a0, a1, b0, b1, y, h, c) => slab(...R(a0, a1, b0, b1), y, h, c);

  const lo = Math.min(ext, corOut), hi = Math.max(ext, corOut);
  const segs1F = chuan ? [[x0, chuan[0]], [chuan[1], x1]] : [[x0, x1]];

  // 基座、走廊地坪
  S(x0, x1, lo, hi, 0, 0.32, '#b8b2a6');
  // 教室量體：1F（川堂留空）＋ 2F
  for (const [a, b] of segs1F) { S(a, b, wallLine, ext, 0.32, F1 - 0.32, WALL); block(CF, ...L((a + b) / 2, (wallLine + ext) / 2), along === 'x' ? b - a : Math.abs(ext - wallLine), along === 'x' ? Math.abs(ext - wallLine) : b - a, 0, 0.3); }
  S(x0, x1, wallLine, ext, F1, H2 - F1, WALL);
  if (chuan) { S(chuan[0], chuan[1], wallLine, ext, F1 - 0.3, 0.3, '#e2ddd3'); S(chuan[0], chuan[1], wallLine - cs * 0.01, ext, 0.33, 0.02, '#c9b79c'); }
  // 樓層腰帶
  S(x0 - 0.05, x1 + 0.05, ext - out * 0.0, ext + out * 0.12, F1 - 0.15, 0.3, BAND);
  // 走廊：天花板、2F 欄杆
  S(x0, x1, wallLine, corOut, F1 - 0.25, 0.25, '#e4dfd5');
  S(x0, x1, wallLine, corOut, H2 - 0.3, 0.3, '#e4dfd5');
  // 走廊為懸臂結構，外緣沒有柱子；樓板邊加一道收邊

  S(x0, x1, corOut - cs * 0.12, corOut, H2 - 0.5, 0.5, '#e8e4dc');
  S(x0, x1, corOut - cs * 0.22, corOut, F1, 1.05, '#f7f6f2');
  S(x0, x1, corOut - cs * 0.3, corOut + cs * 0.04, F1 + 1.05, 0.1, '#9aa0a6');
  // 女兒牆與紅色斜瓦簷（四周）
  S(x0 - 0.1, x1 + 0.1, lo - 0.1, hi + 0.1, H2, 0.55, WALL);
  S(x0, x1, lo + 0.25, hi - 0.25, H2 + 0.2, 0.08, '#4aa384');
  const eave = (side, faceB) => {                                   // 沿長邊
    const [lx, lz] = L((x0 + x1) / 2, faceB + side * 0.55);
    const len = x1 - x0 + 2.2;
    if (along === 'x') CF.put(G.box, TILE, lx, H2 + 0.55, lz, 0, len, 0.14, 1.35, -side * 0.5, 0);
    else CF.put(G.box, TILE, lx, H2 + 0.55, lz, 0, 1.35, 0.14, len, 0, -side * 0.5);
  };
  const eaveEnd = (a, sideA) => {                                   // 兩端山牆
    const [lx, lz] = L(a + sideA * 0.55, (lo + hi) / 2);
    const len = hi - lo + 2.2;
    if (along === 'x') CF.put(G.box, TILE, lx, H2 + 0.55, lz, 0, 1.35, 0.14, len, 0, -sideA * 0.5);
    else CF.put(G.box, TILE, lx, H2 + 0.55, lz, 0, len, 0.14, 1.35, -sideA * 0.5, 0);

  eave(Math.sign(hi - (lo + hi) / 2), hi); eave(-1, lo); eaveEnd(x0, -1); eaveEnd(x1, 1);

  // 走廊側：門、窗、名牌
  for (const rm of rooms) {

    if (rm.open) continue;
    const door = rm.a0 + Math.min(1.2, w * 0.25);
    S(door - 0.5, door + 0.5, wallLine, wallLine + cs * 0.06, fy, 2.15, '#7a5236');
    for (let a = door + 1.6; a < rm.a1 - 1.0; a += 2.4) S(a - 0.85, a + 0.85, wallLine, wallLine + cs * 0.06, fy + 1.0, 1.25, '#4c6780');
    if (!rm.name) continue;
    const pw = Math.min(3.0, Math.max(1.8, w * 0.6)), mid = (rm.a0 + rm.a1) / 2;
    if (along === 'x') plate(rm.name, mid, fy + 2.6, wallLine + cs * 0.1, cs > 0 ? Math.PI : 0, pw, 0.56);

  }
  if (chuan) { const mid = (chuan[0] + chuan[1]) / 2; if (along === 'x') plate('川堂', mid, F1 - 0.75, corOut + cs * 0.02, cs > 0 ? Math.PI : 0, 2.0, 0.55, { bg: '#2f6f8f', fg: '#ffffff', border: '#f2c230' }); }

  for (const ar of arrays) {

    const [cx, cz] = L((a0 + a1) / 2, (b0 + b1) / 2);
    const lenA = a1 - a0, lenB = b1 - b0;

    CF.put(G.box, '#223860', cx, H2 + 1.35, cz, 0, sx, 0.1, sz, along === 'x' ? tilt : 0, along === 'z' ? -tilt : 0);
    for (let a = a0 + 1.05; a < a1 - 0.2; a += 1.05) { const [px, pz] = L(a, (b0 + b1) / 2); CF.put(G.box, '#7c93b5', px, H2 + 1.41, pz, 0, along === 'x' ? 0.05 : lenB, 0.02, along === 'x' ? lenB : 0.05, along === 'x' ? tilt : 0, along === 'z' ? -tilt : 0); }
    for (let b = b0 + 1.7; b < b1 - 0.3; b += 1.7) { const [px, pz] = L((a0 + a1) / 2, b); CF.put(G.box, '#7c93b5', px, H2 + 1.35 + (along === 'x' ? -(b - (b0 + b1) / 2) * Math.sin(tilt) : (b - (b0 + b1) / 2) * Math.sin(tilt)) * 0 + 0.06, pz, 0, along === 'x' ? lenA : 0.05, 0.02, along === 'x' ? 0.05 : lenA, along === 'x' ? tilt : 0, along === 'z' ? -tilt : 0); }
    for (let a = a0 + 0.3; a <= a1; a += 3) for (const b of [b0 + 0.3, b1 - 0.3]) { const [px, pz] = L(a, b); CF.put(G.box, '#8d959e', px, H2 + 0.75, pz, 0, 0.12, 1.1, 0.12); }
  }
  // 樓梯間與水塔
  for (const [s0, s1] of stairs) {

    S(s0 - 0.15, s1 + 0.15, lo + 0.45, hi - 0.45, H2 + 2.8, 0.2, TILE);

  }
}

function wovenTexture() {
  // 白底背心＋布農族菱形織紋（紅、黃、黑、紫）
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f5f1e6'; g.fillRect(0, 0, 256, 256);
  const band = (y, h) => {
    g.fillStyle = '#1f1d24'; g.fillRect(0, y, 256, h);
    for (let x = 0; x < 256; x += 32) {
      g.fillStyle = '#c0342c'; g.beginPath(); g.moveTo(x + 16, y + 2); g.lineTo(x + 30, y + h / 2); g.lineTo(x + 16, y + h - 2); g.lineTo(x + 2, y + h / 2); g.fill();
      g.fillStyle = '#f2c230'; g.beginPath(); g.moveTo(x + 16, y + h * 0.28); g.lineTo(x + 23, y + h / 2); g.lineTo(x + 16, y + h * 0.72); g.lineTo(x + 9, y + h / 2); g.fill();
    }
    g.fillStyle = '#6b3f8f'; g.fillRect(0, y - 4, 256, 4); g.fillRect(0, y + h, 256, 4);
  };
  band(150, 34); band(214, 26);
  g.fillStyle = '#c0342c'; g.fillRect(0, 40, 256, 6);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; return t;
}

function buildMinimap() {
  const c = document.createElement('canvas'); c.width = NX * MM.scale; c.height = NZ * MM.scale;
  const g = c.getContext('2d');
  const img = g.createImageData(NX, NZ), col = new THREE.Color();
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = X0 + i * CELL, z = Z0 + j * CELL;
    col.set(colorFor(classify(x, z), x, z));
    const h = HRAW[j * NX + i], hl = HRAW[j * NX + Math.max(0, i - 1)], hu = HRAW[Math.max(0, j - 1) * NX + i];
    const shade = clamp(1 + ((hl - h) + (hu - h)) * 0.025, 0.6, 1.25);
    const k = (j * NX + i) * 4;
    img.data[k] = clamp(col.r * 255 * shade, 0, 255); img.data[k + 1] = clamp(col.g * 255 * shade, 0, 255); img.data[k + 2] = clamp(col.b * 255 * shade, 0, 255); img.data[k + 3] = eastOfRiver(x, z) ? 0 : 255;
  }
  const tmp = document.createElement('canvas'); tmp.width = NX; tmp.height = NZ; tmp.getContext('2d').putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true; g.drawImage(tmp, 0, 0, c.width, c.height);
  const toM = (x, z) => [(x - X0) / CELL * MM.scale, (z - Z0) / CELL * MM.scale];
  const line = (pts, w, color) => { g.beginPath(); pts.forEach((p, k) => { const [a, b] = toM(p[0], p[1]); k ? g.lineTo(a, b) : g.moveTo(a, b); }); g.lineWidth = w; g.strokeStyle = color; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); };
  line(RIVER, 5, '#3d9ad6'); for (const cr of CREEKS) line(cr.pts, 2, '#3d9ad6');
  line(MAIN_ROAD, 2.4, '#ffffff'); for (const r of VILLAGE_ROADS) line(r, 1.4, '#f5f2ea');
  // 等高線 200 m（黃）與 360 m（紅）
  for (const [lv, color] of [[200, 'rgba(242,194,48,.95)'], [360, 'rgba(184,50,42,.8)']]) {
    g.fillStyle = color;
    for (let j = 0; j < NZ - 1; j++) for (let i = 0; i < NX - 1; i++) {
      const a = HRAW[j * NX + i], b = HRAW[j * NX + i + 1], d = HRAW[(j + 1) * NX + i];

    }
  }

}

{

function logoDecal(g, x, y, z, size, side) {

  m.position.set(x, y, z); m.rotation.y = side * Math.PI / 2; g.add(m); return m;
}
function signTex(text, bg, fg, w = 512, h = 96) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, w, h); x.fillStyle = fg; x.font = `700 ${h * 0.58}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeMinibus() {
  // 定時班次：20 人座白色小型巴士（車頭朝 +z）
  const g = new THREE.Group();
  const S = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.1, ...o });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const WHITE = S('#ffffff', { roughness: 0.55, metalness: 0, emissive: '#2a2a2a' }), GLASS = S('#33495c', { roughness: 0.15, metalness: 0 }), DARK = S('#1d1d1f'), GRAY = S('#c9ccd0');
  add(new THREE.BoxGeometry(2.05, 2.2, 6.9), WHITE, 0, 1.55, 0);                                     // 車身
  add(new THREE.BoxGeometry(2.0, 0.15, 6.7), WHITE, 0, 2.72, -0.05);                                 // 車頂
  add(new THREE.BoxGeometry(1.9, 0.12, 2.2), GRAY, 0, 2.84, -1.2);                                   // 冷氣機
  for (const sd of [-1, 1]) {
    add(new THREE.BoxGeometry(0.04, 0.8, 5.5), GLASS, sd * 1.03, 2.08, -0.55);                    // 側窗帶
    for (let k = 0; k <= 6; k++) add(new THREE.BoxGeometry(0.06, 0.82, 0.12), WHITE, sd * 1.035, 2.08, -3.3 + k * 0.917);   // 窗柱
  }
  const ws = add(new THREE.BoxGeometry(1.9, 1.05, 0.08), GLASS, 0, 2.05, 3.44); ws.rotation.x = -0.12;     // 擋風玻璃
  add(new THREE.BoxGeometry(0.06, 1.6, 0.85), GLASS, 1.03, 1.55, 2.6);                                // 右前車門
  add(new THREE.BoxGeometry(2.07, 0.12, 6.92), S('#e9a23b'), 0, 1.3, 0);                             // 橘色腰線
  add(new THREE.BoxGeometry(2.1, 0.32, 7.0), DARK, 0, 0.55, 0);                                       // 保險桿與裙邊
  for (const sd of [-1, 1]) add(new THREE.BoxGeometry(0.32, 0.16, 0.05), S('#fff6c4', { emissive: '#7a6a26' }), sd * 0.7, 1.0, 3.47);
  for (const [x, z] of [[-0.95, 2.3], [0.95, 2.3], [-0.95, -2.2], [0.95, -2.2]]) { const w = add(new THREE.CylinderGeometry(0.45, 0.45, 0.32, 18), DARK, x, 0.45, z); w.rotation.z = Math.PI / 2; }
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.26), new THREE.MeshBasicMaterial({ map: signTex('幸福巴士 卓楓⇄白端', '#151515', '#ffb43a'), toneMapped: false }));
  sign.position.set(0, 2.5, 3.5); g.add(sign);
  for (const sd of [-1, 1]) logoDecal(g, sd * 1.04, 1.45, -1.6, 1.15, sd);
  scene.add(g); return g;
}
function makeSedan(color) {
  // 預約制：私人轎車，每台顏色不同，車門貼幸福巴士標誌（車頭朝 +z）
  const g = new THREE.Group();
  const S = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.05, ...o });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const BODY = S(color), GLASS = S('#2a3a48', { roughness: 0.15 }), DARK = S('#1a1a1a');
  add(new THREE.BoxGeometry(1.8, 0.62, 4.5), BODY, 0, 0.62, 0);
  add(new THREE.BoxGeometry(1.6, 0.58, 2.3), BODY, 0, 1.2, -0.25);
  add(new THREE.BoxGeometry(1.62, 0.44, 2.0), GLASS, 0, 1.2, -0.25);
  const wf = add(new THREE.BoxGeometry(1.5, 0.05, 0.85), GLASS, 0, 1.2, 1.15); wf.rotation.x = 0.62;
  const wr = add(new THREE.BoxGeometry(1.5, 0.05, 0.7), GLASS, 0, 1.2, -1.62); wr.rotation.x = -0.7;
  add(new THREE.BoxGeometry(1.84, 0.2, 4.56), DARK, 0, 0.36, 0);
  for (const sd of [-1, 1]) add(new THREE.BoxGeometry(0.34, 0.12, 0.05), S('#fff6c4', { emissive: '#7a6a26' }), sd * 0.62, 0.72, 2.26);
  for (const [x, z] of [[-0.82, 1.4], [0.82, 1.4], [-0.82, -1.4], [0.82, -1.4]]) { const w = add(new THREE.CylinderGeometry(0.33, 0.33, 0.24, 16), DARK, x, 0.33, z); w.rotation.z = Math.PI / 2; }
  for (const sd of [-1, 1]) logoDecal(g, sd * 0.905, 0.62, 0.15, 0.62, sd);
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.2), new THREE.MeshBasicMaterial({ map: signTex('幸福巴士', '#ffffff', '#d9631e', 256, 80), toneMapped: false, side: THREE.DoubleSide }));
  roof.position.set(0, 1.62, -0.25); g.add(roof);
  scene.add(g); return g;
}

function roadTangent(i) { const a = MAIN_ROAD[Math.max(0, i - 2)], b = MAIN_ROAD[Math.min(MAIN_ROAD.length - 1, i + 2)]; const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [(b[0] - a[0]) / L, (b[1] - a[1]) / L]; }
function nearestRoadIndex(x, z) { let bi = 0, bd = Infinity; MAIN_ROAD.forEach((p, i) => { const d = (p[0] - x) ** 2 + (p[1] - z) ** 2; if (d < bd) { bd = d; bi = i; } }); return bi; }
function curb(i, off) { const [tx, tz] = roadTangent(i), p = MAIN_ROAD[i]; return [p[0] + tz * off, p[1] - tx * off]; }   // off > 0：道路西側

function roadPoint(s) {

}

  const x = x0 + tz * off, z = z0 - tx * off;
  v.mesh.position.set(x, ground(x, z) + 0.36, z);   // 路面高出地面 0.35 m，輪胎貼在路面上
  v.mesh.rotation.y = Math.atan2(tx * dir, tz * dir);

const SEG = 4;  // MAIN_ROAD 每段約 4 m

/* ---------- ubike ---------- */

/* ---------- 定時幸福巴士 ---------- */
function busNext(k, dir, n) { let d = dir; if (k + d < 0 || k + d >= n) d = -d; return [Math.max(0, Math.min(n - 1, k + d)), d]; }

      if (T.rideVeh === b) toast(`幸福巴士到站：${b.route[b.k].name}`);

}
function boardBus() {

/* ---------- 預約制轎車 ---------- */
function saveBookings() { store.set('zf-bubu', T.bookings); }
function stopByName(n) { return T.stops.find(s => s.name === n); }
const carOf = b => T.cars.find(c => c.id === b.carId);
function dispatchCars(now) {
  for (const b of T.bookings.filter(x => x.status === 'booked').sort((a, c) => a.time - c.time)) {
    if (b.time < now - BUBU_RULES.waitMinutes * 60000) { b.status = 'expired'; saveBookings(); renderBubu(); continue; }
    const pick = stopByName(b.from), free = T.cars.filter(c => c.state === 'idle' || c.state === 'returning');
    const car = free.find(c => c.id === b.carId) || free.sort((a, c) => Math.abs(a.s - pick.i) - Math.abs(c.s - pick.i))[0];
    if (!car) continue;
    if (now >= b.time - etaSeconds(car.s, pick.i) * 1000) { b.status = 'arriving'; b.carId = car.id; car.booking = b; car.target = pick.i; car.state = 'toPickup'; saveBookings(); renderBubu(); }
  }
}
function updateCars(dt) {
  const now = Date.now(); dispatchCars(now);
  for (const c of T.cars) {
    if (c.target != null) {
      const sp = BUBU_RULES.speed / SEG * dt * (T.rideVeh === c ? T.fast : 1), d = c.target - c.s;
      c.dir = Math.sign(d) || c.dir || 1;
      if (Math.abs(d) <= sp) { c.s = c.target; c.target = null; carArrive(c); } else c.s += Math.sign(d) * sp;
      placeVehicle(c);
    }
    if (c.state === 'waiting' && now - c.waitStart > BUBU_RULES.waitMinutes * 60000) {
      c.booking.status = 'expired'; c.booking = null; c.state = 'returning'; c.target = c.home; saveBookings(); renderBubu(); toast('預約轎車等候逾時，這筆預約已取消');
    }

}
function carArrive(c) {
  const b = c.booking;

    c.state = 'waiting'; c.waitStart = Date.now(); b.status = 'waiting'; saveBookings(); renderBubu();
    toast(`${c.name}已到「${b.from}」，請在 ${BUBU_RULES.waitMinutes} 分鐘內上車`);
  } else if (c.state === 'riding') {
    b.status = 'done'; saveBookings();
    saveRecord('car', { from: b.from, to: b.to, people: b.people, fee: b.fee, name: b.name, car: c.name });
    c.state = 'returning'; c.booking = null; c.target = c.home;
    alight(stopByName(b.to)); renderBubu(); toast(`抵達「${b.to}」，謝謝搭乘卓溪幸福巴士`);
  } else if (c.state === 'returning') c.state = 'idle';
}
function boardCar(c) {
  const b = c.booking;
  if (T.mode === 'bike') { toast('請先把 ubike 還到車站，再上車'); return; }
  c.state = 'riding'; b.status = 'riding'; c.target = stopByName(b.to).i; T.mode = 'car'; T.rideVeh = c; saveBookings(); renderBubu();
  avatar.g.visible = false; $('card').hidden = true; document.body.classList.remove('has-card');
  toast(`坐上${c.name}，前往「${b.to}」`);

  const c = carOf(b);

  b.status = 'cancelled'; saveBookings(); renderBubu();

/* ---------- 面板 ---------- */

function renderBus() {

function edLayoutFromObjs() {

    if (o.type === 'house' && changed) L.houses[o.idx] = [r2(o.x), r2(o.z), r3(o.ry)];
    else if (o.type === 'lm' && changed) L.lm[o.lm] = [r2(o.x), r2(o.z), r3(o.ry - o.base)];
    else if (o.type === 'campus' && changed) { const it = CAMPUS_ITEMS[o.cid], [pe, pn] = toPlan(o.x, o.z); L.campus[o.cid] = [r2(pe - it.pe), r2(pn - it.pn), r3(Math.atan2(Math.sin(o.ry + RAD), Math.cos(o.ry + RAD)))]; }

    const mid = RIVER[Math.floor(RIVER.length * 0.42)];
    landmark({ name: '秀姑巒溪', area: '溪流', x: mid[0], z: mid[1], y: RIVER_WL[Math.floor(RIVER.length * 0.42)], kind: 'natural', labelH: 14, radius: 70, desc: '學區東側的大河。寬闊的礫石河床上，水道分岔又交會（辮狀河道），河水由南往北流。學校東方約 350–500 m 就是河床。' });
    const gf = CREEKS[0].pts[Math.floor(CREEKS[0].pts.length * 0.35)];
    landmark({ name: '古楓溪', area: '溪流', x: gf[0], z: gf[1], kind: 'natural', labelH: 10, radius: 22, desc: '從西側山谷流出，經過卓楓國小南方，向東匯入秀姑巒溪。' });
    const bd = CREEKS[1].pts[Math.floor(CREEKS[1].pts.length * 0.3)];
    landmark({ name: '白端北側支流', area: '溪流', x: bd[0], z: bd[1], kind: 'natural', labelH: 10, radius: 22, desc: '從白端部落北側的山谷流出，向東匯入秀姑巒溪。' });
    const g = LANDMARKS.filter(l => l.area === '古楓部落'), b = LANDMARKS.filter(l => l.area === '白端部落');
    const avg = arr => arr.reduce((s, l) => [s[0] + l.x / arr.length, s[1] + l.z / arr.length], [0, 0]);
    const [gx, gz] = avg(g), [bx, bz] = avg(b);
    landmark({ name: '古楓部落', area: '古楓部落', x: gx - 70, z: gz - 70, kind: 'area', labelH: 70, radius: 0, desc: '' });
    landmark({ name: '白端部落', area: '白端部落', x: bx - 30, z: bz - 20, kind: 'area', labelH: 45, radius: 0, desc: '' });
  }
  makeLabels(); buildMinimap(); updateProgress(); renderBubu(); initEditor();
  $('fact-count').textContent = DISCOVERABLE().length;
  window.__zfDebug = { roadHits: () => {
    const out = [];
    for (const o of OBST) {
      const pts = [];
      for (let a = -1; a <= 1; a += 0.25) for (let b = -1; b <= 1; b += 0.25) {
        const lx = a * (o.hw - 0.45), lz = b * (o.hd - 0.45);
        pts.push([o.x + lx * o.c + lz * o.s, o.z - lx * o.s + lz * o.c]);
      }
      let worst = 0;
      ALL_ROADS.forEach((r, k) => { const hw = k === 0 ? 3 : 2.2; for (const p of pts) { const d = distToPolyline(p[0], p[1], r).d; if (hw - d > worst) { worst = hw - d; o.rk = k; } } });
      if (worst > 0.3) out.push([o.x.toFixed(1), o.z.toFixed(1), worst.toFixed(1), o.rk]);
    }
    return out;
  }, T, placeVehicle, rentBike, boardCar, boardBus, leaveBus, setCam: (p, t) => { camTween = null; camera.position.set(...p); controls.target.set(...t); }, teleport, toggleBird, camera, controls, player, setHeading: h => { heading = h; } };
  window.__zf = { obstacles: OBST.length, houses: nHouses, trees: TREES.broad.length + TREES.conifer.length, landmarks: LANDMARKS.length };

  // 起點：校門口
  const [sx, sz] = fromPlan(-57, 47);
  player.set(sx, ground(sx, sz), sz);
  heading = Math.PI + RAD; // 面向圖面南方（走進校園）
  avatar.g = buildAvatar();
  camera.position.set(CENTER.x + 1200, 1300, CENTER.z + 1700); controls.target.copy(CENTER);
  status.textContent = '';
  $('boot-enter').disabled = false;
  $('hint').textContent = hintText();
  ready = true;
}
let ready = false, started = false, attract = 0;
$('boot-enter').addEventListener('click', () => {
  started = true; $('boot').hidden = true; document.body.classList.add('is-playing');
  const t = player.clone().add(new THREE.Vector3(0, 2.4, 0));
  tweenCamera(t.clone().add(new THREE.Vector3(Math.sin(heading) * -17, 11, -Math.cos(heading) * -17)), t, 1600);
});
$('boot-login').addEventListener('click', () => { $('login-note').hidden = !$('login-note').hidden; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const mm = $('minimap'); const cw = mm.clientWidth; mm.width = cw * 2; mm.height = Math.round(cw * 2 * NZ / NX);
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), mv = new THREE.Vector3();
let walkT = 0, walkAmt = 0, lastNear = null, hudT = 0;
function frame() {
  requestAnimationFrame(frame);
  if (PAUSED) { clock.getDelta(); return; }
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05);
  if (!ready) { renderer.render(scene, camera); return; }
  const now = performance.now();

  if (camTween) {
    const k = smooth(clamp((now - camTween.t0) / camTween.ms, 0, 1));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k); controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    if (k >= 1) camTween = null;
  } else if (!started) {
    attract += dt * 0.05;
    camera.position.set(CENTER.x + Math.sin(attract) * 1900, 1250, CENTER.z + Math.cos(attract) * 1900);
    controls.target.copy(CENTER);
  }

  // 移動
  let ix = 0, iz = 0;
  if (keys.has('w') || keys.has('arrowup')) iz += 1;
  if (keys.has('s') || keys.has('arrowdown')) iz -= 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  ix += joy.x; iz += -joy.y;
  const mag = Math.min(1, Math.hypot(ix, iz));
  const g = avatar.g;
  if (started && !bird && mag > 0.08 && !camTween && !T.rideVeh) {
    fwd.subVectors(controls.target, camera.position).setY(0).normalize();
    right.crossVectors(fwd, camera.up).normalize();
    mv.copy(fwd).multiplyScalar(iz).addScaledVector(right, ix).normalize();
    const fastKey = running || keys.has('shift');
    const speed = (T.mode === 'bike' ? (fastKey ? 26 : 16) : (fastKey ? 14 : 6)) * mag;
    const nz = clamp(player.z + mv.z * speed * dt, Z0 + 12, ZMAX - 12), nx = clamp(player.x + mv.x * speed * dt, X0 + 12, riverX(nz) - 3);
    let tx = nx, tz = nz;
    if (blocked(tx, tz)) { if (!blocked(nx, player.z)) tz = player.z; else if (!blocked(player.x, nz)) tx = player.x; else { tx = player.x; tz = player.z; } }
    if (campusDist(tx, tz) <= 0 && campusDist(player.x, player.z) <= 0 && Math.abs(ground(tx, tz) - player.y) > 0.5) {
      if (Math.abs(ground(tx, player.z) - player.y) <= 0.5 && !blocked(tx, player.z)) tz = player.z;
      else if (Math.abs(ground(player.x, tz) - player.y) <= 0.5 && !blocked(player.x, tz)) tx = player.x;
      else { tx = player.x; tz = player.z; }
    }
    const ny = ground(tx, tz);
    const delta = new THREE.Vector3(tx - player.x, ny - player.y, tz - player.z);
    player.set(tx, ny, tz);
    camera.position.add(delta); controls.target.add(delta);
    const targetHeading = Math.atan2(mv.x, -mv.z);
    let dh = targetHeading - heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    heading += dh * Math.min(1, dt * 12);
    if (T.mode === 'bike') T.riding.dist += Math.hypot(delta.x, delta.z);
    walkT += dt * (T.mode === 'bike' ? speed * 0.9 : (fastKey ? 11 : 8.5) * mag);
  }
  if (g) {
    g.position.copy(player); g.rotation.y = -heading + Math.PI;
    const moving = started && !bird && mag > 0.08 && !camTween;
    walkAmt += ((moving ? 1 : 0) - walkAmt) * Math.min(1, dt * 8);
    if (T.mode === 'bike') animateRider(g, walkT, walkAmt, now);
    else { g.userData.body.position.y = 0; animateAvatar(g, walkT, walkAmt, running || keys.has('shift'), now); }
    g.userData.ring.material.opacity = 0.55 + Math.sin(now / 300) * 0.3;
    const s = bird ? 12 : 1.3; g.scale.setScalar(s);
  }

  // 愛心專車
  if (T.bus) {
    const rv = T.rideVeh, before = rv ? rv.mesh.position.clone() : null, vdt = Math.min(rawDt, 0.5);
    updateBus(vdt); updateCars(vdt);
    if (rv) {
      const d = rv.mesh.position.clone().sub(before);
      player.copy(rv.mesh.position);
      camera.position.add(d); controls.target.copy(rv.mesh.position).add(new THREE.Vector3(0, 2.2, 0));
    }
  }
  updateTransitUI();

  // 陰影跟隨
  const focus = bird ? controls.target : player;
  sun.target.position.copy(focus); sun.position.copy(focus).add(SUN_OFF); sun.target.updateMatrixWorld();

  controls.update();
  if (!bird && !camTween && started) {
    // 鏡頭不鑽入地面
    const gy = ground(camera.position.x, camera.position.z) + 2.5;
    if (camera.position.y < gy) camera.position.y = gy;
  }
  const far = bird || !started; scene.fog.near = far ? 2500 : 700; scene.fog.far = far ? 9000 : 4200;

  // 接近地標
  if (started && !bird && !T.rideVeh) {
    let best = null, bd = Infinity;
    for (const L of LANDMARKS) {
      if (L.kind === 'area') continue;
      const d = Math.hypot(L.x - player.x, L.z - player.z);
      if (d < L.radius && d < bd) { best = L; bd = d; }
    }
    if (!best && lastNear && cardAuto) { $('card').hidden = true; document.body.classList.remove('has-card'); cardFor = null; }
    if (best && best !== lastNear) {
      openCard(best, true);
      if (!found.has(best.name)) { found.add(best.name); store.set('zf-found', [...found]); updateProgress(); toast(`發現新地點：${best.name}`); }
    }
    lastNear = best;
  }

  camera.updateMatrixWorld();
  updateLabels();
  hudT += dt;
  if (hudT > 0.12) {
    hudT = 0;
    $('elev').textContent = Math.round(realElev(player.x, player.z));
    $('where').textContent = areaName(player.x, player.z);
    $('dist').textContent = Math.round(Math.hypot(player.x, player.z));
    const cd = new THREE.Vector3().subVectors(controls.target, camera.position);
    const camHeading = Math.atan2(cd.x, -cd.z);
    $('compass-needle').style.transform = `rotate(${-camHeading}rad)`;
    drawMinimap(player, heading);
  }
  renderer.render(scene, camera);
}
boot().then(() => { requestAnimationFrame(frame); }).catch(err => { status.textContent = '載入失敗：' + err.message; console.error(err); });

</script>
